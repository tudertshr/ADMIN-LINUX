<body>
<header>
<h1>Linux et administration des services</h1>
<p>Neuf parties, chacune avec sa couleur. Pour chaque notion : l'idée simple, un exemple, puis une ligne à taper dans votre terminal Ubuntu.</p>
</header>
<nav id="nav" aria-label="Parties du cours"></nav>
<div class="bar"><input id="q" type="search" placeholder="Chercher une commande ou un mot (ex. chmod, kill, fstab)" aria-label="Rechercher"><span id="prog"></span></div>
<main id="m"></main>
<footer>Tapez chaque ligne de pratique dans une machine virtuelle : c'est ainsi qu'on retient.</footer>
<script>
const D=[
["sym","🔣","0. Tous les symboles Linux",300,"Tout ce qui n'est pas une lettre a un sens spécial dans le shell. Apprenez ces symboles : ils reviennent dans chaque commande.",[
["Chemins : / ~ . .. -","`/` racine, et séparateur entre dossiers. `~` votre dossier personnel. `.` le dossier où vous êtes. `..` le dossier parent. `-` avec cd : retour au dossier précédent. Un nom qui commence par un point est caché (.bashrc). Pour lancer un script du dossier courant il faut ./ devant son nom","cd ~/cours\ncd ..\ncd -\nls -a\n./script.sh","cd /etc && cd .. && pwd && cd - && pwd"],
["Jokers : * ? [ ] { }","`*` n'importe quelle suite de caractères, même vide. `?` exactement un caractère. `[abc]` un caractère parmi a, b ou c, et `[0-9]` un chiffre. `{a,b}` fabrique plusieurs noms. Le shell remplace le joker avant de lancer la commande. Cas d'usage : supprimer tous les .log, ou créer tp1 tp2 tp3 d'un coup","ls *.txt\nls fichier?.txt\nls fichier[0-9].txt\nmkdir cours{1,2,3}\ncp rapport.{txt,bak}","mkdir -p ~/t/{a,b,c} && touch ~/t/a/f{1,2,3}.txt && ls ~/t/a/f*.txt"],
["Variables et substitution : $","`$VAR` valeur d'une variable. `${VAR}` pareil, utile collé à du texte. `$(commande)` est remplacé par le résultat de la commande. `$?` code de retour de la dernière commande, 0 veut dire succès. `$$` numéro du shell, `$!` numéro du dernier processus en arrière-plan. `$1 $2` arguments d'un script, `$0` son nom. `export VAR=valeur` transmet la variable aux programmes lancés. Pas d'espace autour du =","echo $HOME\nNOM=alice\necho Bonjour ${NOM}\necho On est le $(date +%F)\nls /inexistant ; echo $?","echo Bonjour $USER, il est $(date +%H:%M)"],
["Guillemets et antislash","Apostrophes simples : tout est littéral, rien n'est remplacé. Guillemets doubles : $VAR et $(...) sont remplacés, et les espaces sont protégés. L'antislash annule le sens spécial du caractère suivant : espace, $, * ou guillemet. En fin de ligne il continue la commande sur la ligne suivante. Cas d'usage : un nom de fichier avec espace, ou afficher un vrai $","echo '$HOME'\necho \"$HOME\"\nmkdir \"Mes Documents\"\nmkdir Mes\\ Documents\necho prix : \\$5","echo '$HOME' \"$HOME\""],
["Redirections et pipes : > >> < 2> |","`>` écrit dans un fichier et l'écrase. `>>` ajoute à la fin. `<` envoie un fichier en entrée. `2>` envoie les messages d'erreur ailleurs. `2>&1` erreurs au même endroit que la sortie normale, `&>` pareil en plus court. `|` le tuyau : la sortie de gauche devient l'entrée de droite. `/dev/null` est la poubelle. `tee` écrit dans un fichier ET affiche. Cas d'usage : garder une trace d'une commande longue","ls /etc > liste.txt\nls /nope 2> erreurs.txt\nls /etc /nope &> tout.txt\nsort < liste.txt\nps aux | grep ssh | wc -l\nls /etc | tee liste.txt","ls /etc /nope > out.txt 2> err.txt ; cat err.txt"],
["Enchaîner : ; && || & ( )","`;` exécute l'une puis l'autre, quoi qu'il arrive. `&&` la suivante seulement si la première réussit. `||` la suivante seulement si la première échoue. `&` lance en arrière-plan. `( )` groupe des commandes dans un sous-shell. Cas d'usage : mettre à jour puis installer, ou tester un hôte et prévenir en cas d'échec","mkdir d && cd d\nping -c1 hote || echo injoignable\nsleep 5 &\n(cd /tmp ; pwd)\nsudo apt update && sudo apt upgrade -y","true && echo oui ; false || echo non"],
["Autres symboles : # ! % @ : = ^","`#` commentaire ignoré par le shell, et # en fin de prompt veut dire root. `$` en fin de prompt veut dire utilisateur normal. `!!` répète la dernière commande, `!$` son dernier argument. `%1` désigne la tâche numéro 1 (fg %1). `@` sépare utilisateur et machine (alice@serveur). `:` sépare des champs (/etc/passwd, PATH). `=` affecte une valeur. `-` option courte, `--` option longue, `--` seul marque la fin des options. Dans grep : `^` début de ligne, `$` fin de ligne, `.` un caractère quelconque, `*` répétition","# commentaire\ngrep '^root' /etc/passwd\ngrep 'bash$' /etc/passwd\nsudo !!\nfg %1\necho $PATH","grep '^root' /etc/passwd ; grep 'bash$' /etc/passwd"],
["Raccourcis clavier","Ctrl+C arrête le programme. Ctrl+Z le met en pause. Ctrl+D fin de saisie, ou déconnexion. Ctrl+L efface l'écran. Ctrl+R cherche dans l'historique. Ctrl+A début de ligne, Ctrl+E fin de ligne. Ctrl+U efface avant le curseur, Ctrl+W efface un mot. Tab complète, deux fois affiche les choix. Flèches haut et bas : historique. Alt+. insère le dernier argument","Ctrl+R puis ssh\nCtrl+A  début de ligne\nTab Tab  liste les choix","history | tail -5"]]],
["shell","💻","1. Le shell et les commandes de base",210,"Le noyau est la cuisine, le shell est le serveur qui transmet vos ordres écrits. Une commande s'écrit : commande -options arguments. Tab complète les noms, la flèche haut rappelle l'historique, man commande ouvre le manuel.",[
["pwd, ls, cd : se repérer","pwd affiche où vous êtes. ls liste le contenu (-l détails, -a fichiers cachés). cd change de dossier (cd .. remonte, cd ~ retourne chez vous). Tout part de la racine /.","pwd\nls -lah /etc\ncd /var/log","cd /var/log && pwd && ls | head -3 && cd ~"],
["mkdir, touch, echo, cat : créer et lire","mkdir crée un dossier (-p crée toute la chaîne). touch crée un fichier vide. echo écrit du texte : > remplace le fichier, >> ajoute à la fin. cat affiche le contenu.","mkdir -p cours/tp1\necho \"Bonjour\" > salut.txt\necho \"Ligne 2\" >> salut.txt\ncat salut.txt","mkdir -p ~/cours/tp1 && cd ~/cours/tp1 && echo \"ligne 1\" > t.txt && echo \"ligne 2\" >> t.txt && cat t.txt"],
["cp, mv, rm : copier, déplacer, supprimer","cp est le photocopieur (-r pour un dossier). mv déplace ou renomme. rm supprime pour toujours, sans corbeille : prenez l'habitude de rm -i qui demande confirmation.","cp t.txt copie.txt\nmv copie.txt vieux.txt\nrm -i vieux.txt","cp t.txt copie.txt && mv copie.txt vieux.txt && rm -i vieux.txt && ls"],
["grep : chercher dans le texte","grep est le Ctrl+F du terminal : il affiche les lignes qui contiennent un mot. Options : -i ignore la casse, -n numérote, -v inverse, -r cherche dans un dossier.","grep \"root\" /etc/passwd\ngrep -rn \"PermitRoot\" /etc/ssh/","grep \"$USER\" /etc/passwd"],
["chmod et chown : droits et propriétaire","Trois cases (propriétaire, groupe, autres) et trois droits : r=4, w=2, x=1. On additionne : 7=rwx, 6=rw-, 5=r-x, 4=r--. chmod change les droits, chown change le propriétaire (avec sudo).","chmod 755 script.sh\nchmod u+x script.sh\nsudo chown alice:devs fichier.txt","touch s.sh && chmod 750 s.sh && ls -l s.sh"],
["dd : copie brute octet par octet","dd copie sans se soucier des fichiers : clonage de disque, images, fichiers de test. if= source, of= destination, bs= taille de bloc. Une erreur sur of= écrase un disque : entraînez-vous seulement sur des fichiers.","dd if=/dev/zero of=test.img bs=1M count=10","dd if=/dev/zero of=~/test.img bs=1M count=5 && ls -lh ~/test.img"],
["ps, su, sudo : processus et pouvoirs","ps montre les processus. su change de compte (mot de passe de l'autre compte). sudo exécute une seule commande en administrateur avec votre mot de passe, et laisse une trace dans les journaux : c'est la méthode recommandée.","ps aux | head\nsudo apt update\nsudo usermod -aG sudo alice","whoami && sudo whoami"],["Options à connaître : ls, cp, rm, grep, find...","ls : -t trie par date, -S par taille, -R récursif, -d le dossier lui-même. cp : -r dossier, -p garde dates et droits, -u copie si plus récent. mv et rm : -i demande confirmation, -f force, -r dossier. grep : -c compte les lignes, -l liste les fichiers, -w mot entier, -A 2 deux lignes après. cat : -n numérote. head et tail : -n N lignes. wc : -l lignes, -w mots. sort : -n numérique, -r inverse. find : -name, -type f, -mtime -1 (moins d'un jour), -size +100M","ls -lSh\nls -ltr\ncp -rp src/ copie/\ngrep -rnw root /etc\nsort -rn notes.txt\nfind / -size +100M 2>/dev/null","ls -ltr /var/log | tail -5"],["Astuces et cas d'usage","Rejouer la commande précédente avec sudo : sudo !!. Dernier argument de la ligne précédente : !$. Chercher dans l'historique : Ctrl+R, ou history | grep mot. Raccourci personnel : alias ll='ls -lah'. Trouver un fichier par nom : find / -name fichier.txt 2>/dev/null. Savoir ce qui prend la place : du -sh * | sort -h. Cas d'usage : sauvegarder avant de modifier avec cp fichier fichier.bak. Cas d'usage : lire un gros journal avec less puis / pour chercher","sudo !!\nhistory | grep ssh\nalias ll='ls -lah'\nfind /etc -name '*.conf' -mtime -1\ncp fichier fichier.bak","find /etc -name '*.conf' 2>/dev/null | head -3"]]],
["gui","🖥️","2. Interface graphique : GUI, GNOME, KDE, X Window",275,"Sous Linux l'interface graphique est un programme comme un autre, qu'on installe ou retire sans toucher au reste. Chaîne de quatre maillons : serveur d'affichage, gestionnaire de fenêtres, environnement de bureau, écran de connexion.",[
["X Window et Wayland","X11 (1984) dessine les pixels et gère souris et clavier, en mode client/serveur : une application peut tourner sur un serveur distant et s'afficher chez vous (ssh -X). Wayland est son successeur plus simple et plus sûr, utilisé par défaut sur Ubuntu récent.","echo $XDG_SESSION_TYPE\nssh -X alice@serveur xclock","echo $XDG_SESSION_TYPE"],
["GNOME et KDE","Deux environnements de bureau. GNOME : épuré, par défaut sur Ubuntu et Fedora, fichiers avec Nautilus, connexion GDM. KDE Plasma : très personnalisable, fichiers avec Dolphin, connexion SDDM. Les deux font le même travail, c'est une question de goût.","sudo apt install kde-plasma-desktop","echo $XDG_CURRENT_DESKTOP"],
["Consoles texte et mode de démarrage","Ctrl+Alt+F3 à F6 ouvrent de vraies consoles texte, Ctrl+Alt+F1 ou F2 reviennent au graphique. Un serveur démarre en général sans bureau (multi-user.target) pour économiser mémoire et risques.","systemctl get-default\nsudo systemctl set-default multi-user.target","systemctl get-default"],["Utiliser l'interface GNOME (Ubuntu)","Touche Super (Windows) : vue d'ensemble, tapez le nom d'une appli pour la lancer. Dock à gauche : applis favorites, clic droit puis Épingler. Barre du haut : horloge et notifications, et en haut à droite réseau, son, batterie et menu pour éteindre. Paramètres : réseau, comptes, écrans, mises à jour. Fichiers : barre latérale, Ctrl+L pour taper un chemin, Ctrl+H pour montrer les fichiers cachés. Terminal : Ctrl+Alt+T. Alt+Tab change de fenêtre, Super+flèches place une fenêtre. Logiciels : installer par clics, c'est l'équivalent graphique de apt. KDE : menu en bas à gauche, fichiers avec Dolphin, réglages dans Configuration du système","Ctrl+Alt+T  ouvrir un terminal\nSuper  vue d'ensemble\nCtrl+L  taper un chemin dans Fichiers\nxdg-open ~","xdg-open ~"]]],
["apps","📦","3. Applications : APT, processus, pipes",150,"APT est le magasin officiel en ligne de commande : il télécharge un paquet depuis les dépôts et installe aussi toutes ses dépendances. Les dépôts sont listés dans /etc/apt/sources.list.",[
["APT : installer et mettre à jour","update met à jour le catalogue (rien n'est installé). upgrade met à jour vos logiciels. install ajoute, remove retire en gardant la configuration, purge retire tout, autoremove nettoie les dépendances inutiles. apt-get est l'ancienne version, mêmes options.","sudo apt update\nsudo apt upgrade\nsudo apt install tree\napt search nginx\nsudo apt purge tree","sudo apt update && sudo apt install -y tree && tree ~ | head"],
["ps et top : voir les processus","Un processus a un PID, un parent (PPID), un propriétaire et un état. ps est une photo, top est une vidéo en direct (M trie par mémoire, P par CPU, k tue, q quitte). load average donne la charge sur 1, 5 et 15 minutes.","ps aux | grep ssh\npstree\ntop","top -b -n 1 | head -12"],
["kill : envoyer un signal","kill n'arrête pas toujours : il envoie un signal. 15 (SIGTERM) demande un arrêt propre, 9 (SIGKILL) force, 1 (SIGHUP) recharge souvent la configuration. Essayez toujours 15 avant 9.","kill 1234\nkill -9 1234\npkill firefox","sleep 300 & kill $!"],
["Pipes et redirections","Le pipe | envoie la sortie d'une commande à la suivante, comme une chaîne de montage. > écrit dans un fichier, >> ajoute, 2> redirige les erreurs, /dev/null est la poubelle. Outils fréquents : sort, uniq, wc, cut, head, tail.","ps aux | grep ssh | wc -l\nfind / -name \"*.conf\" 2>/dev/null","cat /etc/passwd | cut -d: -f1 | sort | head -5"],
["Arrière-plan et jobs","commande & lance en arrière-plan, Ctrl+Z met en pause, jobs liste, bg relance en arrière-plan, fg ramène au premier plan, Ctrl+C interrompt.","sleep 100 &\njobs\nfg","sleep 100 & jobs"],["Astuces processus et APT","Trier par mémoire : ps aux --sort=-%mem | head. Trouver un PID par nom : pgrep -a ssh. Lister les signaux : kill -l. Lancer sans que la fermeture du terminal l'arrête : nohup commande &. Mises à jour disponibles : apt list --upgradable. Infos sur un paquet : apt show nom, apt policy nom. Installer sans question : apt install -y nom. Installer un .deb téléchargé : sudo apt install ./fichier.deb. Nettoyer le cache : sudo apt clean. Cas d'usage : serveur lent, top puis ps puis kill","ps aux --sort=-%mem | head -5\npgrep -a ssh\napt list --upgradable\nsudo apt install -y htop\nnohup ./long.sh &","ps aux --sort=-%mem | head -5"]]],
["fs","🗂️","4. Systèmes de fichiers",35,"Le système de fichiers est le plan de la ville du disque. Pour utiliser un disque : partitionner, formater, monter, utiliser. ext4 est le standard Linux (ext3 ajoute le journal, ext2 n'en a pas), NFS partage par le réseau, CDFS lit les CD/ISO, swap prolonge la RAM, HFS+ et APFS sont ceux d'Apple.",[
["MBR ou GPT : la table des partitions","MBR : ancien, disques jusqu'à 2 To, 4 partitions principales, démarrage BIOS. GPT : moderne, disques géants, 128 partitions, copie de secours, démarrage UEFI. Les disques s'appellent /dev/sda (partitions sda1, sda2), ou /dev/nvme0n1p1.","lsblk\nsudo fdisk -l","lsblk"],
["Partitionner et formater","fdisk découpe (n nouvelle, d supprime, g GPT, p affiche, w écrit : rien n'est modifié avant w). mkfs.ext4 crée le système de fichiers, mkswap prépare un swap. Formater efface tout : exercez-vous sur un disque virtuel.","sudo fdisk /dev/sdb\nsudo mkfs.ext4 /dev/sdb1\nsudo mkswap /dev/sdb2 && sudo swapon /dev/sdb2","swapon --show; df -T | head"],
["Monter : mount, umount, fstab","Monter, c'est brancher une partition sur un dossier vide (point de montage). Toujours démonter avant de débrancher. Pour un montage automatique, une ligne dans /etc/fstab avec l'UUID (blkid) ; testez avec mount -a avant de redémarrer.","sudo mount /dev/sdb1 /mnt/usb\nsudo umount /mnt/usb\nUUID=1a2b-3c4d /data ext4 defaults 0 2","findmnt /"],
["df et du : l'espace disque","df -h montre l'espace libre par partition. du -sh montre la taille d'un dossier. Combinés avec sort -h, ils désignent ce qui remplit le disque.","df -h\ndu -h --max-depth=1 /var | sort -h","du -sh ~/* 2>/dev/null | sort -h"],
["Permissions avancées","Sur un dossier : r liste, w crée/supprime des fichiers dedans, x permet d'y entrer. umask 022 retire des droits : fichiers en 644, dossiers en 755. SUID (s) exécute avec les droits du propriétaire (passwd), SGID hérite du groupe, sticky bit (t, comme /tmp) interdit de supprimer les fichiers des autres.","umask\nls -ld /tmp\nls -l /usr/bin/passwd\nsudo chmod 2775 /srv/equipe","umask && ls -ld /tmp && ls -l /usr/bin/passwd"],
["Liens matériels et symboliques","Un fichier = un nom + des données (inode). Lien matériel : un deuxième nom pour les mêmes données, survit à la suppression de l'original. Lien symbolique : un raccourci qui casse si la cible disparaît, mais qui traverse les partitions et marche sur les dossiers.","ln original.txt dur.txt\nln -s original.txt raccourci.txt\nls -li","touch o.txt && ln o.txt dur.txt && ln -s o.txt sym.txt && ls -li o.txt dur.txt sym.txt"],
["NFS : partager par le réseau","Le serveur exporte un dossier, les clients le montent comme un dossier local. Serveur : paquet nfs-kernel-server et une ligne dans /etc/exports. Client : paquet nfs-common et mount.","/srv/partage 192.168.1.0/24(rw,sync,no_subtree_check)\nsudo exportfs -ra\nsudo mount 192.168.1.10:/srv/partage /mnt/nfs","showmount -e 192.168.1.10"],["Astuces disques et cas d'usage","Types et UUID : lsblk -f ou blkid. Montages : findmnt. Espace en lisible : df -hT. Inodes (disque plein alors qu'il reste de la place) : df -i. Qui remplit le disque : du -h --max-depth=1 / | sort -h. Un fichier ouvert empêche le démontage : lsof +D /mnt/usb, puis fermer et umount. Étiquette ext4 : sudo e2label /dev/sdb1 DATA. Infos ext4 : sudo tune2fs -l /dev/sdb1. Cas d'usage : ajouter un disque de données (lsblk, fdisk, mkfs.ext4, mount, fstab)","lsblk -f\ndf -i\nsudo du -h --max-depth=1 / 2>/dev/null | sort -h | tail\nsudo lsof +D /mnt/usb\nsudo tune2fs -l /dev/sdb1 | head","lsblk -f"]]],
["admin","🛠️","5. Administration de base et services Linux",345,"Un administrateur crée les comptes, installe et configure les services, surveille, sauvegarde, sécurise et dépanne. Sous Linux on règle un service en éditant un fichier texte de /etc, ce qui permet de le sauvegarder, le versionner et l'automatiser.",[
["Utilisateurs et groupes","/etc/passwd liste les comptes (nom:x:UID:GID:commentaire:dossier:shell), /etc/shadow garde les mots de passe chiffrés, /etc/group les groupes. Un UID inférieur à 1000 désigne un compte système, 0 est root.","sudo adduser alice\nsudo passwd alice\nsudo usermod -aG sudo alice\nsudo deluser --remove-home bob\nid alice","id && groups"],
["Fichiers de configuration dans /etc","Exemples : /etc/hosts (nom vers IP), /etc/resolv.conf (DNS), /etc/fstab, /etc/ssh/sshd_config, /etc/apache2/, /etc/netplan/. Méthode : sauvegarder (cp fichier fichier.bak), éditer (nano), tester la syntaxe (sshd -t), recharger le service.","sudo cp /etc/ssh/sshd_config /etc/ssh/sshd_config.bak\nsudo nano /etc/ssh/sshd_config\nsudo sshd -t","grep -v \"^#\" /etc/ssh/sshd_config | grep -v \"^$\""],
["Journaux dans /var/log","Les journaux sont la boîte noire du serveur. syslog (général), auth.log (connexions et sudo), kern.log (noyau), apache2/ (accès et erreurs). tail -f suit en direct. journalctl lit journald ; logrotate archive les vieux fichiers.","sudo tail -f /var/log/auth.log\nsudo grep \"Failed password\" /var/log/auth.log\njournalctl -u ssh --since \"1 hour ago\"\njournalctl -p err -b","sudo grep \"sudo\" /var/log/auth.log | tail -5"],
["systemctl : piloter les services","start/stop agissent maintenant, enable/disable au prochain démarrage (enable --now fait les deux). reload relit la configuration sans coupure, restart coupe brièvement. status montre l'état et les dernières lignes de journal.","sudo systemctl enable --now apache2\nsudo systemctl reload apache2\nsystemctl status apache2\nsystemctl --failed","systemctl status ssh --no-pager | head -5"],
["Exemple complet : serveur web Apache","Installer, activer, tester. Configuration dans /etc/apache2/, pages dans /var/www/html/, journaux dans /var/log/apache2/, ports 80 (HTTP) et 443 (HTTPS). Après un changement : apachectl configtest puis reload.","sudo apt install apache2\nsudo systemctl enable --now apache2\ncurl http://localhost","curl -I http://localhost"],
["Réseau, pare-feu et cron","ip a (adresses), ss -tulpn (ports en écoute), ufw (pare-feu : autorisez SSH avant de l'activer !). cron planifie : cinq champs minute heure jour mois jour-semaine puis la commande.","ip a\nsudo ufw allow 22/tcp\nsudo ufw enable\ncrontab -e\n30 2 * * * /home/alice/sauvegarde.sh","ss -tulpn | head"],
["Créer son propre service systemd","Un fichier unité dans /etc/systemd/system/ : [Unit] (description, ordre), [Service] (commande, utilisateur, Restart), [Install] (WantedBy=multi-user.target). Puis daemon-reload et enable --now.","[Service]\nExecStart=/usr/bin/python3 -m http.server 8000\nRestart=on-failure\n\nsudo systemctl daemon-reload\nsudo systemctl enable --now monappli","systemctl cat ssh | head -15"],["Astuces administrateur","Ce que vous avez le droit de faire : sudo -l. Éditer les droits sudo sans risque : sudo visudo. Dernières connexions : last -n 5. Qui est connecté : who ou w. Verrouiller un compte : sudo passwd -l alice. Âge du mot de passe : sudo chage -l alice. Connexion SSH par clé : ssh-keygen puis ssh-copy-id alice@serveur. Copier vers un serveur : scp fichier alice@serveur:/tmp/. Tâches systemd planifiées : systemctl list-timers. Suivre un service en direct : journalctl -u ssh -f. Cas d'usage : un compte n'arrive pas à se connecter, lire auth.log puis tester sshd -t","sudo -l\nlast -n 5\nsudo chage -l alice\nssh-keygen -t ed25519\nssh-copy-id alice@serveur\nscp fichier alice@serveur:/tmp/","last -n 5"]]],
["ssl","🔐","6. Sécurité Ubuntu : OpenSSL et autorité de certification",180,"Un certificat est une carte d'identité numérique d'un serveur, signée par une autorité de certification (CA) en laquelle on a confiance. Vous allez devenir votre propre CA : créer sa clé, signer des certificats de serveurs, les vérifier.",[
["1. Créer la CA : clé et certificat racine","La clé privée ca.key est le secret absolu, à protéger. Le certificat ca.crt est public : c'est lui qu'on distribue aux clients pour qu'ils fassent confiance à votre CA.","openssl genrsa -out ca.key 4096\nopenssl req -x509 -new -key ca.key -days 3650 -out ca.crt -subj \"/CN=Ma-CA\"","openssl x509 -in ca.crt -noout -subject -dates"],
["2. Clé et demande de certificat du serveur","Le serveur crée sa propre clé, puis une demande de signature (CSR) qui dit : voici mon nom, signez-moi. La clé privée du serveur ne quitte jamais le serveur.","openssl genrsa -out srv.key 2048\nopenssl req -new -key srv.key -out srv.csr -subj \"/CN=serveur.local\"","openssl req -in srv.csr -noout -subject"],
["3. Signer et vérifier","La CA signe la demande avec sa clé et produit le certificat. verify contrôle la chaîne de confiance.","openssl x509 -req -in srv.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out srv.crt -days 365\nopenssl verify -CAfile ca.crt srv.crt","openssl verify -CAfile ca.crt srv.crt"],
["4. Serveur de certificats : activer HTTPS sur Apache","Copier srv.crt et srv.key, activer le module ssl et le site SSL, pointer SSLCertificateFile et SSLCertificateKeyFile dans /etc/apache2/sites-available/default-ssl.conf, puis recharger. Le client importe ca.crt pour faire confiance.","sudo a2enmod ssl\nsudo a2ensite default-ssl\nsudo apachectl configtest && sudo systemctl reload apache2","curl --cacert ca.crt https://serveur.local"]]],
["krb","🎫","7. Kerberos : authentification par tickets",60,"Comme un cinéma : on prouve son identité une fois au guichet (le KDC) et l'on reçoit un ticket principal (TGT) valable plusieurs heures. Avec ce ticket on obtient ensuite des tickets pour chaque service sans retaper le mot de passe. Le royaume (realm) s'écrit en majuscules, par exemple LAB.LOCAL.",[
["Serveur : installer le KDC","Le serveur KDC délivre les tickets. krb5_newrealm crée le royaume et demande un mot de passe maître. Les ports utilisés : 88 (tickets) et 749 (administration). Les horloges doivent être synchronisées à quelques minutes près.","sudo apt install krb5-kdc krb5-admin-server\nsudo krb5_newrealm","systemctl status krb5-kdc --no-pager | head -4"],
["Créer les comptes (principals)","Un principal est une identité : utilisateur (alice@LAB.LOCAL) ou service (host/serveur.lab.local@LAB.LOCAL). kadmin.local s'utilise sur le serveur lui-même.","sudo kadmin.local -q \"addprinc alice\"\nsudo kadmin.local -q \"listprincs\"","sudo kadmin.local -q \"listprincs\""],
["Client : /etc/krb5.conf","Le client doit connaître le royaume et l'adresse du KDC dans /etc/krb5.conf (sections [libdefaults] et [realms]), et résoudre le nom du KDC par le DNS ou /etc/hosts.","sudo apt install krb5-user\n[libdefaults]\n default_realm = LAB.LOCAL\n[realms]\n LAB.LOCAL = { kdc = kdc.lab.local }","grep default_realm /etc/krb5.conf"],
["Vérification : kinit, klist, kdestroy","kinit demande un ticket (mot de passe une fois). klist montre les tickets et leur expiration. kdestroy les supprime. Si kinit échoue : horloge, nom du royaume en majuscules, port 88 ouvert.","kinit alice\nklist\nkdestroy","klist"],["Histoire et Kerberos 4 contre Kerberos 5","Né au MIT dans le projet Athena (1983-1991), il porte le nom de Cerbère, le chien à trois têtes qui gardait les enfers. La version 4 (fin des années 80) n'utilise que DES 56 bits et des champs de taille fixe. La version 5 (1993, RFC 1510 puis RFC 4120) est décrite en ASN.1, négocie le chiffrement (AES, RFC 3962), ajoute des options de tickets et change le format des principaux. Implémentations : MIT, Heimdal, et Active Directory depuis Windows 2000.","Kerberos 4 : gambs.admin@IRISA.FR\nKerberos 5 : gambs/admin@IRISA.FR","dpkg -l | grep krb5"],["Vocabulaire : royaume, principal, clé, KDC","Le royaume (realm) est le réseau protégé, écrit en MAJUSCULES, souvent comme le domaine. Un principal est une identité : utilisateur, machine ou service. Chacun a une clé, dérivée du mot de passe pour un utilisateur, avec le royaume ajouté comme sel : le même mot de passe dans deux royaumes donne deux clés différentes. Le KDC est le tiers de confiance, avec deux services : l'AS (Authentication Server) délivre le TGT, le TGS (Ticket Granting Server) délivre les tickets de service. Toute la sécurité repose sur lui : il faut le protéger.","alice@LAB.LOCAL\nalice/admin@LAB.LOCAL\nhost/serveur.lab.local@LAB.LOCAL\nssh/serveur.lab.local@LAB.LOCAL","sudo kadmin.local -q 'getprinc alice'"],["Déroulement : du TGT au ticket de service","1) Le client envoie AS-REQ : qui il est, sans mot de passe. 2) L'AS répond AS-REP : un TGT et une clé de session chiffrés avec la clé de l'utilisateur, donc seul le bon mot de passe les ouvre. 3) Pour un service, le client envoie son TGT et un authentifieur (identité et heure) au TGS. 4) Le TGS répond avec un ticket de service chiffré avec la clé du service. 5) Le client présente ce ticket au service, qui le déchiffre avec sa propre clé. Le TGT dure en général 24 h : un seul mot de passe, puis tout est automatique (SSO).","kinit alice\nkvno host/serveur.lab.local\nklist","klist -e"],["Options de tickets de Kerberos 5","Réexpédiable (forwardable) : transmis à une autre machine, qui obtient alors son propre TGT, base du vrai SSO. Délégable (proxiable) : transmis à une autre machine, mais seulement pour obtenir des tickets de service. Renouvelable : le KDC peut prolonger sa durée, ou refuser si un service a été compromis. Postdaté : valable à partir d'une date future, utile pour les tâches planifiées.","kinit -f -r 7d alice\nkinit -R\nklist -f","klist -f"],["Sécurité : attaques et protections","Hors-ligne : AS-REQ n'est pas chiffrée, un attaquant récolte des TGT et teste des mots de passe faibles chez lui. Parades : préauthentification, mots de passe contrôlés et renouvelés, PKINIT (clés publiques, smartcard). Faux KDC : il répond avant le vrai. Parade : demander un ticket pour host/machine et le déchiffrer avec /etc/krb5.keytab (module PAM), et protéger le DNS (DNSSEC). Vol de tickets : le cache est un fichier (/tmp/krb5cc_UID) que root peut lire ; Heimdal propose kcm, Linux peut garder les tickets dans le noyau. Rejeu : un authentifieur capturé reste valable environ 5 minutes (clock skew) ; parade : cache d'authentifieurs. Horloges désynchronisées : plus de tickets, d'où l'usage d'un NTP sécurisé.","ls -l /tmp/krb5cc_$(id -u)\nsudo klist -k /etc/krb5.keytab\ntimedatectl","ls -l /tmp/krb5cc_$(id -u) ; timedatectl | head -4"]]],
["ans","🤖","8. Ansible : automatiser Linux, Apache, MySQL, PHP",250,"Ansible configure plusieurs serveurs à la fois depuis votre poste, par SSH, sans rien installer sur eux. Vous décrivez l'état voulu dans un fichier YAML (un playbook) ; rejouer le playbook ne change que ce qui diffère.",[
["Installer et déclarer l'inventaire","L'inventaire liste les machines et les groupes. Il faut un accès SSH par clé (ssh-copy-id) et python3 sur les cibles.","sudo apt install ansible\nsudo mkdir -p /etc/ansible\nprintf \"[web]\\n192.168.1.20\\n\" | sudo tee /etc/ansible/hosts","ansible all --list-hosts"],
["Commandes ad hoc : ping et module","ansible groupe -m module -a arguments. ping teste la connexion, apt installe, service gère un service, -b donne les droits administrateur.","ansible all -m ping\nansible web -b -m apt -a \"name=htop state=present\"","ansible localhost -m ping"],
["Un playbook : Apache, MySQL et PHP","Un playbook est une liste de tâches idempotentes. become: yes équivaut à sudo. Lancez-le avec ansible-playbook ; --check simule sans rien changer.","- hosts: web\n  become: yes\n  tasks:\n    - apt:\n        name: [apache2, mysql-server, php, libapache2-mod-php]\n        state: present\n        update_cache: yes\n    - service: {name: apache2, state: started, enabled: yes}\n    - copy: {content: \"<?php phpinfo();\", dest: /var/www/html/info.php}","ansible-playbook web.yml --check"]]],
["perf","⚡","9. Performances et optimisation",10,"Méthode : mesurer avant de modifier. Établir une baseline (l'état normal), repérer le goulot (CPU, mémoire, E/S disque, réseau), changer une seule chose, remesurer.",[
["CPU et charge","uptime donne la charge sur 1, 5, 15 minutes : au-delà du nombre de coeurs (nproc), la machine est saturée. top ou htop désigne le coupable. nice/renice baissent la priorité d'un processus gourmand.","uptime\nnproc\nrenice 10 -p 4321","uptime && nproc"],
["Mémoire et swap","free -h : regardez la colonne available, pas free (le cache est récupérable). Du swap qui se remplit en permanence signale un manque de RAM. vmstat 1 : si si/so sont non nuls, le système échange.","free -h\nvmstat 1 5\nsysctl vm.swappiness","free -h"],
["Disque : E/S et stockage","iostat -x (paquet sysstat) montre %util et await. iotop désigne les processus qui écrivent. df -h et du surveillent le remplissage. Le choix du système de fichiers (ext4, xfs) et des options de montage (noatime) agit sur les performances.","sudo apt install sysstat iotop\niostat -x 1 3\nsudo iotop -o","iostat -x 1 2"],
["Réseau","ss -s résume les connexions, ip -s link les compteurs d'erreurs, ping la latence, iperf3 le débit entre deux machines.","ss -s\nip -s link\nping -c 4 8.8.8.8","ss -s"],
["Baseline et suivi dans le temps","sar (sysstat) enregistre CPU, mémoire, disque et réseau toutes les 10 minutes : sans historique, on ne sait pas ce qui est anormal. Notez les valeurs d'un jour normal comme référence.","sudo systemctl enable --now sysstat\nsar -u 1 3\nsar -r 1 3","sar -u 1 3"]]]

const ex=id=>`<div class="card"><h3>✍️ Exercices : tapez la bonne commande</h3><p>Écrivez la commande complète dans la case puis cliquez sur Vérifier (ou Entrée). Le bouton Solution montre la réponse.</p>${X[id].map((x,k)=>`<div class="q" data-i="${id}" data-k="${k}"><p>${e(x[0])}</p><div class="pr"><input class="in" type="text" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Votre commande" placeholder="Votre commande"><button type="button" class="vf">Vérifier</button><button type="button" class="sl">Solution</button></div><div class="res" aria-live="polite"></div></div>`).join("")}</div>`;
const hl=s=>s.split('\n').map(l=>{if(!l||/^(\s|[#\[<\/\-A-Z0-9{]|\S*[:=@]|\S+\s+[:=])/.test(l))return e(l);let cmd=1;return l.replace(/("[^"]*"|'[^']*')|(\|\|?|&&|;|>>|>|2>)|(\s+)|(\S+)/g,(m,q,op,sp,w)=>{if(q)return '<span class="s">'+e(q)+'</span>';if(op){cmd=/^(\|\|?|&&|;)$/.test(op)?1:0;return '<span class="o">'+op.replace(/>/g,'&gt;')+'</span>'}if(sp)return sp;if(w==='sudo')return '<span class="u">sudo</span>';if(/^-/.test(w))return '<span class="f">'+e(w)+'</span>';if(cmd){cmd=0;return '<span class="c">'+e(w)+'</span>'}return /^[\/~.$]/.test(w)?'<span class="p">'+e(w)+'</span>':e(w)})}).join('\n');
const hb=s=>e(s).replace(/`([^`]+)`/g,'<span class="k">$1</span>').replace(/(^|[\s(])(-{1,2}[A-Za-z][\w-]*|\/[\w.\/-]{2,}|(?:sudo|pwd|ls|cd|mkdir|touch|echo|cat|cp|mv|rm|grep|chmod|chown|dd|ps|su|top|kill|pkill|systemctl|apt-get|apt|dpkg|journalctl|kinit|klist|kdestroy|kvno|openssl|ansible-playbook|ansible|mount|umount|fdisk|mkfs|df|ln|ufw|crontab|ssh|free|uptime|renice|tar|rsync)(?![\w-]))/g,(m,a,b)=>a+'<span class="k">'+b+'</span>');
const S={

document.getElementById("m").innerHTML=D.map(c=>`<section id="${c[0]}" style="--h:${c[3]}"><h2>${c[1]} ${e(c[2])}</h2><p class="intro"><b>En bref :</b> ${e(c[4])}</p>${sch(c[0])}${c[5].map((i,k)=>{const id=c[0]+k;return `<article class="card${st[id]?" ok":""}" data-id="${id}"><h3>${e(i[0])}</h3><ul class="pts">${i[1].split(". ").map(s=>`<li>${hb(s.replace(/\.$/,""))}</li>`).join("")}</ul><div class="lab">À faire : les commandes dans l'ordre</div><pre>${hl(i[2])}</pre><div class="lab">🛠 Pratique : tapez cette ligne</div><div class="pr"><pre>${hl(i[3])}</pre><button type="button" data-c="${e(i[3]).replace(/"/g,"&quot;")}">Copier</button></div><label class="done"><input type="checkbox" ${st[id]?"checked":""}> J'ai pratiqué</label></article>`}).join("")}${ex(c[0])}</section>`).join("");

document.getElementById("m").addEventListener("change",ev=>{const a=ev.target.closest("article");if(!a)return;st[a.dataset.id]=ev.target.checked;a.classList.toggle("ok",ev.target.checked);sv();up()});
document.getElementById("q").addEventListener("input",ev=>{const v=ev.target.value.toLowerCase();document.querySelectorAll("article").forEach(a=>a.hidden=v&&!a.textContent.toLowerCase().includes(v));if(v){document.querySelectorAll("section").forEach(s=>s.hidden=![...s.querySelectorAll("article")].some(a=>!a.hidden))}else{show(cur)}});
document.getElementById("m").addEventListener("click",ev=>{const b=ev.target.closest(".vf,.sl");if(!b)return;const q=b.closest(".q"),x=X[q.dataset.i][q.dataset.k],r=q.querySelector(".res");if(b.classList.contains("sl")){r.className="res";r.innerHTML='Solution : <pre style="display:inline-block;margin:4px 0">'+hl(x[2])+'</pre>';return}const v=q.querySelector(".in").value.trim().replace(/\s+/g," "),ok=x[1].test(v);r.className="res "+(ok?"ok":"no");r.textContent=ok?"✅ Correct, bien joué !":"❌ Pas encore. Relisez l'exemple ou cliquez sur Solution."});
document.getElementById("m").addEventListener("keydown",ev=>{if(ev.key==="Enter"&&ev.target.classList.contains("in"))ev.target.closest(".q").querySelector(".vf").click()});
const secs=[...document.querySelectorAll("section")],tabs=[...document.querySelectorAll("#nav a")];let cur=(location.hash||"").slice(1);if(!secs.some(s=>s.id===cur))cur=secs[0].id;
function show(id,go){cur=id;secs.forEach(s=>s.hidden=s.id!==id);tabs.forEach(a=>{const on=a.getAttribute("href")==="#"+id;a.style.background=on?"hsl("+a.style.getPropertyValue("--h")+" 65% 42%)":"";a.style.color=on?"#fff":"";a.style.fontWeight=on?"700":""});if(go)document.getElementById("m").scrollIntoView()}
tabs.forEach(a=>a.addEventListener("click",ev=>{ev.preventDefault();document.getElementById("q").value="";document.querySelectorAll("article").forEach(x=>x.hidden=false);show(a.getAttribute("href").slice(1),1)}));show(cur);
